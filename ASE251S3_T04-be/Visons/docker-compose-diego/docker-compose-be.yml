services:
  visons-app:
    build:
      context: ..
      dockerfile: dockerfile-diego/Dockerfile
    image: diego5621/diegodock:latest
    container_name: visons-backend-diego
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:sqlserver://visons-mssql:1433;databaseName=Visons;encrypt=true;trustServerCertificate=true"
      DB_USER: "sa"
      DB_PASSWORD: "Admin12345!"
      DB_DRIVER: "com.microsoft.sqlserver.jdbc.SQLServerDriver"   # ← faltaba esto
      SPRING_PROFILES_ACTIVE: "sqlserver"
      PORT: "8080"
      SERVER_URL: "http://localhost:8080"
      MAIL_HOST: "smtp.gmail.com"
      MAIL_PORT: "587"
      MAIL_USERNAME: "lizeth.quispe@vallegrande.edu.pe"
      MAIL_PASSWORD: "fecpfmmawlxxdcua"
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: "lizeth.quispe@vallegrande.edu.pe"
    networks:
      - visons-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

networks:
  visons-network:
    external: true
