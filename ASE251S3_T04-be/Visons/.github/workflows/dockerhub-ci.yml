name: CI - Build and Push Docker Image

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LIZETH }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LIZETH }}

      - name: Build Docker image
        run: |
          docker build -t pipeline-t04-be:latest -f dockerfile-lizeth/Dockerfile .

      - name: Push Docker image
        run: |
          docker tag pipeline-t04-be:latest lizethquispesuarez/pipeline-t04-be:latest
          docker push lizethquispesuarez/pipeline-t04-be:latest